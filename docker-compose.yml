services:
  clearance-tracker:
    build: .
    # Binds only to this host's WireGuard interface IP (the "Main" tunnel),
    # so the port is unreachable except through the tunnel.
    ports:
      - "10.77.77.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./config/companies.json:/app/config/companies.json
    restart: unless-stopped
